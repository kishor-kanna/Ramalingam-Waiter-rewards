<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rewards">
<meta name="robots" content="noindex">
<title>Daily Rewards · Ramalingam Hotel</title>
<link rel="manifest" href="manifest-waiter.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<main>
  <section id="login" class="signin" hidden>
    <img src="img/logo.png" alt="Ramalingam Hotel" width="94" height="120">
    <h1>Daily Rewards</h1>
    <p class="note">Sign in once on this phone.</p>
    <form id="loginForm">
      <label>Branch<select id="lbranch" required><option value="">Loading…</option></select></label>
      <label>Your name<select id="lname" required><option value="">Choose a branch first</option></select></label>
      <label>PIN<input id="lpin" placeholder="Your PIN" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required></label>
      <button class="primary" id="lbtn">Sign in</button>
      <p class="err" id="lerr" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <header class="top"><img src="img/logo.png" alt="Ramalingam Hotel" width="38" height="48"><div class="t"><div class="k" id="where"></div><h1>Today's rewards</h1></div><button class="sound" id="sound" aria-label="Sound on" aria-pressed="true">🔊</button><button class="link" id="out">Sign out</button></header>
    <div class="when"><span id="who"></span> · <span id="date"></span></div>
    <div class="status" id="status" role="status"></div>
    <div class="banner" id="banner"></div>
    <div class="earned"><span>Earned today</span><b id="earned"></b></div>
    <div id="tiers"></div>
    <p class="center"><button class="link" id="undo">Undo</button></p>
    <section class="month" aria-labelledby="mtitle">
      <div class="mhead">
        <button class="mnav" id="mprev" aria-label="Previous month">‹</button>
        <h2 id="mtitle">This month</h2>
        <button class="mnav" id="mnext" aria-label="Next month">›</button>
      </div>
      <div class="stats">
        <div><b id="mEarned">₹0</b><span>Earned</span></div>
        <div><b id="mDays">0</b><span>Days worked</span></div>
        <div><b id="mHits">0</b><span>Targets hit</span></div>
      </div>
      <div id="mItems" class="items big"></div>
      <h3 id="mDayTitle">Day by day</h3>
      <div id="mList" class="items big"></div>
      <p class="note center" id="mNote"></p>
    </section>
  </section>
</main>
<div id="toast"></div>

<script>
// Paste the web app URL from Apps Script (Deploy → Manage deployments). It ends in /exec.
const API_URL = 'https://script.google.com/macros/s/AKfycbzvrDbh6gzwttvzte-PTJdCJmq6tXCN_9iuhi03QJdwAYwIgCdqZ6TZcaA7bsjjLb-l/exec';

const KEY = 'daily-rewards-app-v1';
const $ = id => document.getElementById(id);
const rs = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = s => new Date(s + 'T12:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// user: who is signed in. server: last reply from the Sheet. queue: taps not yet saved there.
let S = {user: null, server: null, queue: [], undo: {shift: '', stack: []}, error: ''};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

async function api(action, data) {
  if (API_URL.includes('PASTE_')) throw Object.assign(new Error('This page is not connected to the Google Sheet yet.'), {server: true});
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  try {
    const res = await fetch(API_URL, {method: 'POST', body: JSON.stringify(Object.assign({action}, data)), signal: ctl.signal});
    const j = await res.json();
    if (!j.ok) throw Object.assign(new Error(j.error || 'Server error'), {server: true});
    return j;
  } finally { clearTimeout(timer); }
}

const resetHour = () => (S.server ? S.server.resetHour : 4);
function shiftOf(t) {
  const d = new Date(t - resetHour() * 36e5);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const targets = () => (S.server ? S.server.targets : []);

// Today's count per item = what the Sheet has + taps still waiting to be sent, never more than the target.
function counts() {
  const shift = shiftOf(Date.now()), c = {};
  if (S.server && S.server.shift === shift) Object.assign(c, S.server.counts);
  S.queue.forEach(e => { if (shiftOf(e.t) === shift) c[e.item] = (c[e.item] || 0) + e.change; });
  targets().forEach(t => { c[t.item] = Math.max(0, Math.min(c[t.item] || 0, t.qty)); });
  return c;
}
const earnedNow = c => targets().reduce((a, t) => a + (t.qty > 0 && c[t.item] >= t.qty ? t.reward : 0), 0);
// Today's grooming check from the manager: ok, no or pending. Rewards only count when it's ok.
const checkNow = () => !S.server || !('check' in S.server) ? {status: 'ok', before: true}   // older Sheet script: no checks yet
  : (S.server.shift === shiftOf(Date.now()) && S.server.check) || {status: 'pending'};
const paidNow = c => (checkNow().status === 'ok' ? earnedNow(c) : 0);
function undoStack() {
  const shift = shiftOf(Date.now());
  if (S.undo.shift !== shift) S.undo = {shift, stack: []};
  return S.undo.stack;
}

let syncing = false, timer = null, backoff = 0;

function render() {
  const signedIn = !!(S.user && S.user.pin);
  $('login').hidden = signedIn; $('app').hidden = !signedIn;
  if (!signedIn) return;
  const c = counts(), T = targets(), max = T.reduce((a, t) => a + t.reward, 0), earned = earnedNow(c);
  $('who').textContent = S.user.name;
  $('where').textContent = S.user.branch || (S.server && S.server.branch) || '';
  $('date').textContent = label(shiftOf(Date.now()));
  const ck = checkNow();
  $('earned').innerHTML = ck.status === 'ok' ? rs(earned)
    : ck.status === 'no' ? `${rs(0)}${earned ? ` <small>${rs(earned)} not approved</small>` : ''}`
    : `${rs(earned)}${earned ? ' <small>pending</small>' : ''}`;
  // One message box: targets when approved, "go get approved" when not. Not approved = greyed items + red glow.
  const live = !!S.server && !ck.before, approved = !live || ck.status === 'ok';
  document.body.classList.toggle('not-approved', live && ck.status === 'no');
  $('tiers').classList.toggle('locked', !approved);
  $('banner').className = 'banner' + (!live ? '' : ck.status === 'no' ? ' bad' : ck.status === 'pending' ? ' wait' : ' good');
  $('banner').textContent = !S.server ? 'Loading today’s targets…'
    : !live ? (earned === max ? `All targets complete. You earned ${rs(max)} today!` : `Hit each item's target to earn up to ${rs(max)} today`)
    : ck.status === 'ok' ? 'Approved!'
    : 'Kindly get approved by manager to unlock today’s incentives';
  $('tiers').innerHTML = T.map(t => {
    const sold = c[t.item] || 0, done = sold >= t.qty;
    return `<div class="tier" data-tier="${esc(t.item)}">
      <div class="row"><span><em aria-hidden="true">${esc(t.icon)}</em> ${t.qty} ${esc(t.item)}</span><span>${done ? '✓ ' : ''}${rs(t.reward)}</span></div>
      <div class="bar"><i style="width:${t.qty ? sold / t.qty * 100 : 0}%"></i></div>
      <div class="items"><div class="${done ? 'ok' : ''}"><span class="cnt">${sold}/${t.qty} sold</span><span>${done ? 'Target reached' : (t.qty - sold) + ' to go'}</span></div></div>
      <button class="add" data-item="${esc(t.item)}" ${done ? 'disabled' : ''}>${done ? '✓ Target reached' : '+1 ' + esc(t.item)}</button>
    </div>`;
  }).join('');
  const st = undoStack(), last = st[st.length - 1];
  $('undo').textContent = last ? `Undo last: ${last}` : 'Undo';
  $('undo').disabled = !last;
  renderMonth();
  const n = S.queue.length, s = $('status');
  s.className = 'status' + (S.error && n ? ' warn' : '');
  s.textContent = syncing ? 'Saving…'
    : n ? `${n} tap${n > 1 ? 's' : ''} not saved yet${S.error ? ' (' + S.error + ')' : ''}. Retrying…`
    : S.server ? 'All saved ✓' : '';
}

/* This month: totals from the Sheet; today's line uses the live counts on this phone. */
const thisMonth = () => shiftOf(Date.now()).slice(0, 7);
let viewMonth = thisMonth(), monthBusy = false;
const monthName = m => new Date(m + '-15T12:00:00').toLocaleDateString('en-IN', {month: 'long', year: 'numeric'});
const shiftMonth = (m, n) => { const d = new Date(m + '-15T12:00:00'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const months = () => (S.months = S.months || {});

async function loadMonth(m) {
  if (!S.user || !S.user.pin || monthBusy) return;
  monthBusy = true;
  try {
    const r = await api('w_month', {branch: S.user.branch, name: S.user.name, pin: S.user.pin, month: m || viewMonth});
    months()[r.month] = r; S.monthError = ''; save();
  } catch (e) {
    S.monthError = /Unknown action/.test(e.message) ? 'Monthly history will show after the next update.' : (months()[viewMonth] ? '' : 'Can’t load this month right now.');
  } finally { monthBusy = false; renderMonth(); }
}

function renderMonth() {
  if (!S.user || !S.server) return;
  const now = thisMonth(), data = months()[viewMonth] || {days: [], items: []}, today = shiftOf(Date.now());
  const icon = {}; targets().forEach(t => icon[t.item] = t.icon);
  let days = data.days.map(d => Object.assign({}, d, {items: Object.assign({}, d.items)}));
  const items = {}; data.items.forEach(i => items[i.item] = Object.assign({}, i));
  if (viewMonth === now) {
    // swap in today's live numbers so a tap shows up here straight away
    const old = days.find(d => d.shift === today);
    if (old) Object.entries(old.items).forEach(([k, n]) => {
      const it = items[k], t = targets().find(x => x.item === k);
      if (!it) return;
      it.sold -= n;
      if (t && n >= t.qty) { it.hits--; if (old.earned) it.earned -= t.reward; }
    });
    days = days.filter(d => d.shift !== today);
    const c = counts(), ck = checkNow(), ok = ck.status === 'ok';
    const live = {shift: today, earned: paidNow(c), potential: earnedNow(c), check: ck.status, reason: ck.reason || '', items: {}};
    targets().forEach(t => {
      const n = c[t.item] || 0; if (!n) return;
      live.items[t.item] = n;
      const it = items[t.item] = items[t.item] || {item: t.item, icon: t.icon, sold: 0, hits: 0, earned: 0};
      it.sold += n; if (n >= t.qty) { it.hits++; if (ok) it.earned += t.reward; }
    });
    if (Object.keys(live.items).length) days.unshift(live);
  }
  const list = Object.values(items).filter(i => i.sold > 0);
  $('mtitle').textContent = viewMonth === now ? 'This month' : monthName(viewMonth);
  $('mprev').disabled = viewMonth <= shiftMonth(now, -12);
  $('mnext').disabled = viewMonth >= now;
  $('mEarned').textContent = rs(days.reduce((a, d) => a + d.earned, 0));
  $('mDays').textContent = days.length;
  $('mHits').textContent = list.reduce((a, i) => a + i.hits, 0);
  $('mItems').innerHTML = list.map(i => `<div><span>${esc(i.icon || icon[i.item] || '')} ${esc(i.item)}</span><span>${i.sold} sold${i.hits ? ` · <b class="ok">${i.hits}× target</b>` : ''}</span></div>`).join('');
  $('mDayTitle').hidden = !days.length;
  const dayNote = d => !d.potential && d.check !== 'no' ? ''
    : d.check === 'no' ? `<small class="bad">Not approved${d.reason ? ': ' + esc(d.reason) : ''} · ${rs(d.potential)} missed</small>`
    : d.check === 'none' ? `<small class="bad">No grooming check · ${rs(d.potential)} missed</small>`
    : d.check === 'pending' ? `<small>Waiting for grooming check</small>` : '';
  $('mList').innerHTML = days.map(d => `<div class="day"><span><b>${d.shift === today ? 'Today' : label(d.shift)}</b><small>${Object.entries(d.items).map(([k, n]) => n + ' ' + esc(k)).join(' · ')}</small>${dayNote(d)}</span><b class="${d.earned ? 'ok' : ''}">${rs(d.earned)}</b></div>`).join('');
  $('mNote').textContent = S.monthError || (days.length ? '' : (viewMonth === now ? 'Your sales this month will show here.' : 'No sales in ' + monthName(viewMonth) + '.'));
}
$('mprev').onclick = () => { viewMonth = shiftMonth(viewMonth, -1); renderMonth(); loadMonth(); };
$('mnext').onclick = () => { viewMonth = shiftMonth(viewMonth, 1); renderMonth(); loadMonth(); };

/* Tap feedback: bounce, floating +1, sliding bar, rising tone; confetti and a chime at the target. */
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let audio;
function tone(freq, at, dur, type, vol) {
  const t0 = audio.currentTime + at, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function sound(progress, win) {
  if (S.sound === false) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const scale = [523.3, 587.3, 659.3, 698.5, 784, 880, 987.8, 1046.5];   // C major, climbing towards the target
    if (win) {
      [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, i * 0.08, 0.32, 'triangle', 0.22));
      tone(1568, 0.34, 0.6, 'sine', 0.12);
    } else {
      const f = scale[Math.min(7, Math.floor(progress * 8))];
      tone(f, 0, 0.13, 'triangle', 0.22); tone(f * 2, 0, 0.07, 'sine', 0.06);
    }
  } catch (e) {}
}
function celebrate(item, was, qty, win) {
  const tier = document.querySelector(`[data-tier="${CSS.escape(item)}"]`); if (!tier) return;
  const btn = tier.querySelector('.add'), fill = tier.querySelector('.bar i'), now = Math.min(was + 1, qty);
  sound(now / qty, win);
  if (navigator.vibrate) navigator.vibrate(win ? [30, 50, 80] : 12);
  // slide the bar from where it was
  fill.style.transition = 'none'; fill.style.width = (was / qty * 100) + '%'; fill.offsetWidth;
  fill.style.transition = ''; fill.style.width = (now / qty * 100) + '%';
  if (calm) return;
  tier.querySelector('.cnt').classList.add('bump');
  btn.classList.add('pop');
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const f = document.createElement('div');
  f.className = 'floater'; f.textContent = '+1'; f.style.left = cx + 'px'; f.style.top = cy + 'px';
  document.body.append(f); setTimeout(() => f.remove(), 800);
  if (!win) return;
  tier.classList.add('won');
  const colours = ['#8c2341', '#d4a017', '#7c963f', '#e8618c', '#1d6b36'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
    c.className = 'confetti';
    c.style.cssText = `left:${cx}px;top:${cy}px;background:${colours[i % colours.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 60}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.append(c); setTimeout(() => c.remove(), 1100);
  }
}
function soundButton() { const b = $('sound'); b.textContent = S.sound === false ? '🔇' : '🔊'; b.setAttribute('aria-pressed', S.sound !== false); b.setAttribute('aria-label', S.sound === false ? 'Sound off' : 'Sound on'); }
$('sound').onclick = () => { S.sound = S.sound === false; save(); soundButton(); if (S.sound) sound(1, false); };
soundButton();

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

function record(item, change) {
  const before = counts(), t = targets().find(x => x.item === item);
  if (!t) return;
  if (change > 0 && before[item] >= t.qty) return;   // already at target
  if (change < 0 && !before[item]) return;           // nothing to undo
  S.queue.push({id: uid(), item, change, t: Date.now()});
  if (change > 0) undoStack().push(item); else undoStack().pop();
  save(); render();
  const gain = earnedNow(counts()) - earnedNow(before), st = checkNow().status;
  if (change > 0) celebrate(item, before[item] || 0, t.qty, gain > 0);
  if (gain > 0) toast(st === 'ok' ? `🎉 ${rs(gain)} earned!` : st === 'no' ? 'Target reached' : `🎉 Target reached! ${rs(gain)} once approved`);
  scheduleSync(700);
}

function scheduleSync(ms) { clearTimeout(timer); timer = setTimeout(sync, ms); }
async function sync() {
  if (syncing || !S.user || !S.user.pin) return;
  syncing = true; render();
  const batch = S.queue.slice(0, 100);
  try {
    const res = await api(batch.length ? 'sync' : 'today', {branch: S.user.branch, name: S.user.name, pin: S.user.pin, events: batch});
    S.user.branch = res.branch;
    const sent = new Set(batch.map(e => e.id));
    S.queue = S.queue.filter(e => !sent.has(e.id));
    S.server = res; S.error = ''; backoff = 0; save();
    if (S.queue.length) scheduleSync(300);
  } catch (e) {
    if (e.server && /PIN|switched off/i.test(e.message)) {
      S.user.pin = null; save();               // keep the name and unsent taps; ask for the PIN again
      $('lerr').textContent = e.message + (S.queue.length ? ' Your unsent taps are kept.' : '');
      loadBranches();
    } else {
      S.error = e.server ? e.message : 'no internet';
      backoff = Math.min(60000, (backoff || 2500) * 2);
      scheduleSync(backoff);
    }
  } finally { syncing = false; render(); }
}

async function loadBranches() {
  try {
    const r = await api('branches', {});
    $('lbranch').innerHTML = (r.branches.length > 1 ? '<option value="">Choose your branch</option>' : '') + r.branches.map(n => `<option>${esc(n)}</option>`).join('');
    if (S.user && S.user.branch) $('lbranch').value = S.user.branch;
    if ($('lbranch').value) loadNames();
  } catch (e) {
    $('lbranch').innerHTML = '<option value="">Can’t load branches</option>';
    $('lerr').textContent = e.server ? e.message : 'Can’t reach the server. Check your internet and reload.';
  }
}
async function loadNames() {
  const branch = $('lbranch').value;
  $('lname').innerHTML = '<option value="">' + (branch ? 'Loading…' : 'Choose a branch first') + '</option>';
  if (!branch) return;
  try {
    const r = await api('waiters', {branch});
    if ($('lbranch').value !== branch) return;
    $('lname').innerHTML = '<option value="">Choose your name</option>' + r.names.map(n => `<option>${esc(n)}</option>`).join('');
    if (S.user && S.user.branch === branch) $('lname').value = S.user.name;
  } catch (e) {
    $('lname').innerHTML = '<option value="">Can’t load names</option>';
    $('lerr').textContent = e.server ? e.message : 'Can’t reach the server. Check your internet and reload.';
  }
}
$('lbranch').onchange = loadNames;

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const branch = $('lbranch').value, name = $('lname').value, pin = $('lpin').value.trim();
  if (!branch || !name) return;
  $('lbtn').disabled = true; $('lerr').textContent = '';
  try {
    const res = await api('today', {branch, name, pin});
    if (S.user && (S.user.name !== res.name || (S.user.branch && S.user.branch !== res.branch))) { S.queue = []; S.undo = {shift: '', stack: []}; }
    if (S.user && S.user.name !== res.name) S.months = {};
    S.user = {branch: res.branch, name: res.name, pin}; S.server = res; S.error = '';
    viewMonth = thisMonth(); loadMonth();
    save(); $('lpin').value = ''; render();
    if (S.queue.length) sync();
  } catch (err) {
    $('lerr').textContent = err.server ? err.message : 'Can’t reach the server. Check your internet.';
  } finally { $('lbtn').disabled = false; }
};

$('tiers').onclick = e => { const b = e.target.closest('button[data-item]'); if (b && !b.disabled) record(b.dataset.item, 1); };
$('undo').onclick = () => { const st = undoStack(); if (st.length) record(st[st.length - 1], -1); };
$('out').onclick = () => {
  if (S.queue.length) { toast('Wait — taps still saving'); sync(); return; }
  S = {user: null, server: null, queue: [], undo: {shift: '', stack: []}, error: '', months: {}};
  save();
  document.body.classList.remove('not-approved'); loadBranches(); render();
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sync(); loadMonth(); } });
addEventListener('online', () => { backoff = 0; sync(); });
setInterval(() => { render(); if (!S.queue.length) sync(); }, 60000);
setInterval(() => { if (!document.hidden) loadMonth(); }, 300000);   // month totals every 5 minutes   // refresh targets and roll over at the day change

render();
if (S.user && S.user.pin) { sync(); loadMonth(); } else loadBranches();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
